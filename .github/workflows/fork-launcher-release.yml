name: fork launcher release
# Free-Horizon: rebuild the launcher after every push that changes it, and publish the Windows
# launcher as a new GitHub release. Upstream's launcher.yml builds three systems and signs its
# checksums with the release key, which a fork does not have, so this workflow is the fork's own.
#
# The version is this fork's launcher version only in name: it is always the number of the official
# launcher, horizon-rust/horizon's newest `launcher@X.Y.Z` release, so the two stay in parity
# (v0.2.30 here is v0.2.30 there). It is given to the build through HORIZON_LAUNCHER_VERSION the way
# upstream's launcher.yml does, so `horizon-launcher --version`, the About box, the tag and the
# release all say the same number (no bump commits). When the official number has not moved since
# the last build, the existing release is rebuilt in place instead of getting a second tag.
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/fork-launcher-release.yml'
  # The official number moving is not a change to this tree, so it is also checked on a schedule
  # (a run that finds the same number does nothing). Offset from fork sync's own 6-hourly run.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Static C runtime: the .exe then needs no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      # Test runs never reach the telemetry server.
      HORIZON_TELEMETRY_URL: "off"
    steps:
      # Tags carry the version, so the whole history comes along.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: fork-launcher

      # gpui compiles its HLSL shaders with fxc.exe, which ships with the Windows SDK on the runner.
      - name: Find fxc.exe
        shell: bash
        run: |
          fxc=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/fxc.exe 2>/dev/null | sort -V | tail -1)
          if [ -z "$fxc" ]; then
            echo "::error::fxc.exe not found on this runner"
            exit 1
          fi
          echo "Using $fxc"
          echo "GPUI_FXC_PATH=$fxc" >> "$GITHUB_ENV"

      # The number is the official launcher's: the newest horizon-rust/horizon release whose tag is
      # `launcher@X.Y.Z` (older ones were `launcher-vX.Y.Z`, on a different number line). Free-Horizon
      # does not count its own builds, so the two launchers always carry the same version.
      - name: Work out the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh release list` is newest first: the first launcher tag is the official current one
          # (sorting the versions would pick the older `launcher-v0.17.0` number line).
          official=$(gh release list --repo horizon-rust/horizon --limit 200 \
            --json tagName --jq '.[].tagName' 2>/dev/null \
            | sed -n 's/^launcher[@-]v\{0,1\}\([0-9][0-9.]*\)$/\1/p' \
            | head -1 || true)
          if [ -z "$official" ]; then
            # No network, or the API refused: stay on the number this fork last used, then on
            # whatever launcher/Cargo.toml says.
            official=$(git tag -l 'fork-launcher-v[0-9]*' | sed 's/^fork-launcher-v//' | sort -V | tail -1)
            if [ -n "$official" ]; then
              echo "::warning::could not read horizon-rust/horizon's launcher version; reusing $official"
            fi
          fi
          if [ -z "$official" ]; then
            echo "::warning::no official version and no previous build; using launcher/Cargo.toml"
            official=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          fi
          version="$official"
          tag="fork-launcher-v$version"
          # A scheduled run exists only to follow the official number: when it has not moved, there
          # is nothing to build. Pushes and manual (or fork sync's) runs always build.
          build=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            build=false
            echo "The official launcher is still $version; nothing to build."
          fi
          echo "Version: $version (horizon-rust/horizon's newest launcher release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the launcher
        if: steps.version.outputs.build == 'true'
        working-directory: launcher
        run: cargo build --release --locked

      - name: The build carries the real version
        if: steps.version.outputs.build == 'true'
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out=$(launcher/target/release/horizon-launcher.exe --version)
          echo "$out"
          if [ "$out" != "horizon-launcher $EXPECTED" ]; then
            echo "::error::expected 'horizon-launcher $EXPECTED'"
            exit 1
          fi

      - name: Package
        if: steps.version.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp launcher/target/release/horizon-launcher.exe dist/
          (cd dist && 7z a ../free-horizon-launcher-windows-x64.zip horizon-launcher.exe > /dev/null)
          sha256sum free-horizon-launcher-windows-x64.zip > dist/SHA256SUMS
          ls -l free-horizon-launcher-windows-x64.zip dist/SHA256SUMS

      - name: Publish the release
        if: steps.version.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          title="Free-Horizon launcher v$VERSION"
          notes="Windows release of the Free-Horizon launcher v$VERSION, the same version as the official launcher (horizon-rust/horizon), built from ${{ github.sha }} by the fork launcher release workflow.

          Offline play is on by default: no Microsoft sign-in is needed to play. Release builds list and update to published \`v*\` game releases only, never a Nightly."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The official number has not moved since the last build: the release keeps its tag and
            # gets the new binary, so the version stays in parity instead of counting up.
            gh release upload "$TAG" --clobber \
              free-horizon-launcher-windows-x64.zip dist/SHA256SUMS
            gh release edit "$TAG" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              free-horizon-launcher-windows-x64.zip dist/SHA256SUMS
          fi
