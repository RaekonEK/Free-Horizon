name: fork launcher release
# Free-Horizon: rebuild the launcher after every push that changes it, and publish the Windows
# launcher as a new GitHub release. Upstream's launcher.yml builds three systems and signs its
# checksums with the release key, which a fork does not have, so this workflow is the fork's own.
#
# The version is real: the patch after the newest `fork-launcher-vX.Y.Z` tag (or launcher/Cargo.toml's
# version for the first release), given to the build through HORIZON_LAUNCHER_VERSION the way
# upstream's launcher.yml does, so `horizon-launcher --version`, the About box and the release all
# say the same number: v0.2.1, v0.2.2, ... (no bump commits).
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/fork-launcher-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-launcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Static C runtime: the .exe then needs no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      # Test runs never reach the telemetry server.
      HORIZON_TELEMETRY_URL: "off"
    steps:
      # Tags carry the version, so the whole history comes along.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: fork-launcher

      # gpui compiles its HLSL shaders with fxc.exe, which ships with the Windows SDK on the runner.
      - name: Find fxc.exe
        shell: bash
        run: |
          fxc=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/fxc.exe 2>/dev/null | sort -V | tail -1)
          if [ -z "$fxc" ]; then
            echo "::error::fxc.exe not found on this runner"
            exit 1
          fi
          echo "Using $fxc"
          echo "GPUI_FXC_PATH=$fxc" >> "$GITHUB_ENV"

      # The real version, worked out before the build so the .exe itself carries it.
      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          last=$(git tag -l 'fork-launcher-v[0-9]*' \
            | sed 's/^fork-launcher-v//' \
            | sed -n 's/^\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' \
            | sort -V | tail -1)
          base=${last:-$cargo_version}
          # The newest tag may be older than launcher/Cargo.toml (a version bumped by hand).
          if [ "$(printf '%s\n%s\n' "$base" "$cargo_version" | sort -V | tail -1)" = "$cargo_version" ]; then
            base=$cargo_version
          fi
          IFS=. read -r major minor patch <<< "$base"
          version="$major.$minor.$((patch + 1))"
          echo "New version: $version (after $base)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-launcher-v$version" >> "$GITHUB_OUTPUT"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=fork-launcher-v$version" >> "$GITHUB_ENV"

      - name: Build the launcher
        working-directory: launcher
        run: cargo build --release --locked

      - name: The build carries the real version
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out=$(launcher/target/release/horizon-launcher.exe --version)
          echo "$out"
          if [ "$out" != "horizon-launcher $EXPECTED" ]; then
            echo "::error::expected 'horizon-launcher $EXPECTED'"
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp launcher/target/release/horizon-launcher.exe dist/
          (cd dist && 7z a ../free-horizon-launcher-windows-x64.zip horizon-launcher.exe > /dev/null)
          sha256sum free-horizon-launcher-windows-x64.zip > dist/SHA256SUMS
          ls -l free-horizon-launcher-windows-x64.zip dist/SHA256SUMS

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Free-Horizon launcher v$VERSION" \
            --notes "Windows release of the Free-Horizon launcher v$VERSION, built from ${{ github.sha }} by the fork launcher release workflow.

          Offline play is on by default: no Microsoft sign-in is needed to play. Release builds list and update to published \`v*\` game releases only, never a Nightly." \
            free-horizon-launcher-windows-x64.zip dist/SHA256SUMS
