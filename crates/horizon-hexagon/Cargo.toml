[package]
name = "horizon-hexagon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HexaGon: port Minecraft: Java Edition mods to Horizon content mods (.hmod)"

[[bin]]
name = "hexagon"
path = "src/main.rs"

[dependencies]
horizon-port-pack = { path = "../horizon-port-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.1.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
